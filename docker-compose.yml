services:
  storage:
    image: postgres:16
    container_name: jobs_storage
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobsdb}
      POSTGRES_USER: ${POSTGRES_USER:-jobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./storage/init:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobs_backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: storage
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-jobsdb}
      POSTGRES_USER: ${POSTGRES_USER:-jobs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ETL_API_TOKEN: ${ETL_API_TOKEN:-}
      FLASK_ENV: production
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      API_PREFIX: ${API_PREFIX:-/api/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TARGET_CLEANED_ROWS: ${TARGET_CLEANED_ROWS:-5000}
      MAX_SOURCE_PAGES: ${MAX_SOURCE_PAGES:-120}
      BATCH_SIZE: ${BATCH_SIZE:-500}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-20}
    ports:
      - "127.0.0.1:${FLASK_PORT:-5000}:5000"
    depends_on:
      - storage

  frontend:
    image: nginx:stable-alpine
    container_name: jobs_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
