services:
  - type: web
    name: jobs-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: POSTGRES_HOST
        fromDatabase:
          name: jobs-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: jobs-postgres
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: jobs-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: jobs-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: jobs-postgres
          property: password
      - key: FLASK_PORT
        value: "5000"
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ORIGINS
        value: https://jobs-frontend.onrender.com
      - key: TARGET_CLEANED_ROWS
        value: "5000"
      - key: FLASK_ENV
        value: production
      - key: ETL_API_TOKEN
        generateValue: true

  - type: web
    name: jobs-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: FRONTEND_API_BASE
        value: https://jobs-backend.onrender.com/api/v1

databases:
  - name: jobs-postgres
    databaseName: jobsdb
    plan: free
